<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TipTrack App Store screenshot treatment</title>
    <style>
      :root {
        --green-950: #062d25;
        --green-800: #07533e;
        --green-100: #dff3e7;
        --cream: #f7f2e9;
        --ink: #16201c;
      }

      * { box-sizing: border-box; }
      html, body { width: 1320px; height: 2868px; margin: 0; overflow: hidden; }
      body {
        background: var(--cream);
        color: white;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      main {
        position: relative;
        width: 1320px;
        height: 2868px;
        overflow: hidden;
        background: var(--cream);
      }

      .hero {
        position: relative;
        height: 435px;
        padding: 48px 96px 42px;
        overflow: hidden;
        background:
          radial-gradient(circle at 90% 0%, rgba(123, 240, 176, 0.30), transparent 31%),
          radial-gradient(circle at 8% 110%, rgba(255, 204, 113, 0.23), transparent 37%),
          linear-gradient(135deg, var(--green-950) 0%, var(--green-800) 100%);
      }

      .hero::after {
        content: "";
        position: absolute;
        width: 460px;
        height: 460px;
        right: -240px;
        bottom: -320px;
        border: 2px solid rgba(255, 255, 255, 0.10);
        border-radius: 50%;
      }

      .brand {
        position: relative;
        z-index: 1;
        display: flex;
        align-items: center;
        gap: 18px;
        color: #ffffff;
        font-size: 30px;
        font-weight: 800;
        letter-spacing: -1px;
      }

      .brand img {
        width: 58px;
        height: 58px;
        border-radius: 15px;
        box-shadow: 0 10px 24px rgba(0, 0, 0, 0.25);
      }

      .eyebrow {
        position: relative;
        z-index: 1;
        margin: 42px 0 8px;
        color: #b9f4d2;
        font-size: 19px;
        font-weight: 800;
        letter-spacing: 1.1px;
        text-transform: uppercase;
      }

      h1 {
        position: relative;
        z-index: 1;
        max-width: 970px;
        margin: 0;
        color: #ffffff;
        font-size: 56px;
        line-height: 1.06;
        letter-spacing: -2.4px;
      }

      .supporting-copy {
        position: relative;
        z-index: 1;
        margin: 12px 0 0;
        color: #dff6e8;
        font-size: 25px;
        line-height: 1.25;
        letter-spacing: -0.25px;
      }

      .screen-stage {
        display: flex;
        align-items: flex-start;
        justify-content: center;
        width: 1320px;
        height: 2433px;
        padding-top: 0;
        background:
          radial-gradient(circle at 50% 0%, rgba(68, 152, 105, 0.13), transparent 35%),
          var(--cream);
      }

      .native-screen {
        width: 1120px;
        height: 2433px;
        display: block;
        object-fit: fill;
        border-radius: 0 0 38px 38px;
        box-shadow: 0 24px 58px rgba(13, 38, 26, 0.20);
      }
    </style>
  </head>
  <body>
    <main id="canvas"></main>
    <script>
      const icon = '../../ios/App/App/Assets.xcassets/AppIcon.appiconset/AppIcon-512@2x.png';
      const screenshots = [
        {
          file: '../app-store-screenshots/01-add-order-native.png',
          eyebrow: 'Delivery tip history for iPhone',
          headline: 'Log delivery orders before the shift moves on.',
          supportingCopy: 'Save the address, order ID, and tip range—or leave the tip for later.'
        },
        {
          file: '../app-store-screenshots/03-update-delayed-tip-native.png',
          eyebrow: 'When a tip updates later',
          headline: 'Update the tip range when it appears.',
          supportingCopy: 'Open the saved delivery and choose the range you recorded.'
        },
        {
          file: '../app-store-screenshots/04-location-history-native.png',
          eyebrow: 'For repeat delivery addresses',
          headline: 'Remember the location history you logged.',
          supportingCopy: 'Review saved addresses and the tip patterns recorded there.'
        },
        {
          file: '../app-store-screenshots/02-orders-native.png',
          eyebrow: 'Find any saved delivery',
          headline: 'Search by order ID or delivery address.',
          supportingCopy: 'Return to the order when you need to update it later.'
        },
        {
          file: '../app-store-screenshots/05-tip-history-reports-native.png',
          eyebrow: 'Your saved tip history',
          headline: 'Review tip ranges across saved orders.',
          supportingCopy: 'See your recorded distribution by tip type—without estimating payouts.'
        }
      ];

      const index = Math.max(0, Math.min(screenshots.length - 1, Number(location.hash.slice(1)) || 0));
      const screen = screenshots[index];
      document.getElementById('canvas').innerHTML = `
        <section class="hero">
          <div class="brand"><img src="${icon}" alt="" /><span>TipTrack</span></div>
          <p class="eyebrow">${screen.eyebrow}</p>
          <h1>${screen.headline}</h1>
          <p class="supporting-copy">${screen.supportingCopy}</p>
        </section>
        <section class="screen-stage">
          <img class="native-screen" src="${screen.file}" alt="" />
        </section>`;
    </script>
  </body>
</html>
